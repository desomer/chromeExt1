<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confirm opening</title>
    <link rel="stylesheet" href="tab-prompt.css" />
  </head>
  <body>
    <main>
      <div class="prompt-heading">
        <p id="eyebrow-text" class="eyebrow">This site wants to open a new tab</p>
        <span class="prompt-indicators">
          <span id="timeout-countdown" class="timeout-badge" hidden></span>
          <span id="pending-count" class="count-badge" aria-live="polite">1</span>
        </span>
      </div>
      <strong id="hostname">Destination</strong>
      <span id="url"></span>
      <code id="interception-mode" hidden></code>
      <code id="source-selector" hidden></code>
      <code id="source-path" hidden></code>
      <code id="source-event" hidden></code>
      <span id="source-state" hidden></span>
      <span id="source-check" hidden></span>
      <fieldset id="global-listeners" hidden>
        <legend>Listeners globaux à retirer</legend>
        <div id="global-listener-list"></div>
      </fieldset>
      <div class="actions">
        <button id="always-allow-to" class="secondary" type="button">
          Allow this destination
        </button>
        <button
          id="deny-disable"
          class="secondary"
          type="button"
          title="Deny and remove click handlers from the source element"
          hidden
        >
          Deny &amp; disable
        </button>
        <button id="deny" class="secondary" type="button" title="Deny this request">  Deny </button>
        <button id="always-allow-from" class="secondary" type="button">
          No confirmation for this site
        </button>
        <button id="allow" class="primary" type="button">Allow</button>
      </div>
    </main>
    <script src="tab-prompt.js"></script>
  </body>
</html>
